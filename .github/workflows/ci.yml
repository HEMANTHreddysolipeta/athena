name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU-only PyTorch)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  retrieval-eval:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2
      - name: Install (CPU-only PyTorch)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Indexes demo_corpus/ (incl. OCR of the scanned PDF) and fails if
      # hybrid search + reranking finds fewer exact passages than measured.
      - run: python eval/run_eval.py retrieval --modes hybrid+rerank --min-evidence 26
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: backend/eval/results/

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: athena:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
