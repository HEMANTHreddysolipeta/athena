[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "chroma_db*", "eval/.index"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/conftest.py" = ["E402"]  # env vars must be set before athena is imported
"eval/*" = ["E402"]
